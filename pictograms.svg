    CODEON MOTION · 실버스타 스포츠 과학원
    운동 동작 계열 픽토그램

    사용 예:
    <svg viewBox="0 0 120 100">
      <use href="pictograms.svg#squat"></use>
    </svg>

    색상은 사용하는 페이지의 CSS color 값을 따릅니다.
    픽토그램은 운동 분류용이며 자세 판정 기준이 아닙니다.
  -->

